[project]
name = "wattdocket-core"
version = "0.1.0"
description = "Deterministic calculation engine for WattDocket — no model calls, ever"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8", "openpyxl>=3.1", "jsonschema>=4.20", "shapely>=2.1,<3", "PyMuPDF>=1.26,<2", "boto3>=1.34", "certifi>=2024.2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wattdocket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
