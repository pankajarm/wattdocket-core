<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f8fa" />
    <script>
      // Apply the saved appearance before the first paint, including on deep links.
      (function () {
        var preference = 'system';
        try { preference = localStorage.getItem('wattdocket-theme') || 'system'; } catch (_) {}
        var dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0d1720' : '#f4f8fa';
      })();
    </script>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <meta
      name="description"
      content="Understand data centers through public evidence. Explore reported electricity and water use, emissions accounting, permit documents and regional grid conditions."
    />
    <title>WattDocket | Data center electricity, water and public records</title>
    <meta property="og:title" content="WattDocket | Understand data centers through public evidence">
    <meta property="og:description" content="Reported electricity and water, permit documents and regional grid conditions. Sources, reporting years and the limits of each claim.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wattdocket.com/">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
